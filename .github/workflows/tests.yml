name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: brew style + audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91  # master @ 2026-05

      # `brew audit` only accepts formula names (not paths) and resolves them
      # through a real tap on disk. Symlink the checkout in so audit/style
      # can address each formula as `yachiko/tap/<name>`.
      - name: Register checkout as a Homebrew tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/yachiko/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: brew style
        run: brew style yachiko/tap

      - name: brew audit
        run: |
          shopt -s nullglob
          formulas=(Formula/*.rb)
          if [ ${#formulas[@]} -eq 0 ]; then
            echo "No formulas yet — skipping audit"
            exit 0
          fi
          for f in "${formulas[@]}"; do
            name=$(basename "$f" .rb)
            echo "::group::$name"
            brew audit --strict --formula "yachiko/tap/$name"
            echo "::endgroup::"
          done
