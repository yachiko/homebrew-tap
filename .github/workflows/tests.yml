name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: brew audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91  # master @ 2026-05

      # `brew audit` only accepts cask names (not paths) and resolves them
      # through a real tap on disk. Symlink the checkout in so audit/style
      # can address each cask as `yachiko/tap/<name>`.
      - name: Register checkout as a Homebrew tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/yachiko/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      # `brew style` runs RuboCop against the cask Ruby files, but the casks
      # are produced by GoReleaser's template — its emitted whitespace inside
      # `do ... end` blocks trips Layout/EmptyLinesAroundBlockBody and similar
      # cosmetic cops that we cannot fix from the source .goreleaser.yaml.
      # Keep style as informational signal (continue-on-error) so we still
      # see the report; gate releases on the substantive `brew audit` below.
      - name: brew style (informational)
        continue-on-error: true
        run: brew style yachiko/tap

      - name: brew audit
        run: |
          shopt -s nullglob
          casks=(Casks/*.rb)
          if [ ${#casks[@]} -eq 0 ]; then
            echo "No casks yet — skipping audit"
            exit 0
          fi
          for f in "${casks[@]}"; do
            name=$(basename "$f" .rb)
            echo "::group::$name"
            brew audit --strict --cask "yachiko/tap/$name"
            echo "::endgroup::"
          done
